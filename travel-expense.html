<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>旅行出費記録</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#3b3a30">
<meta name="apple-mobile-web-app-title" content="出費記録">
<style>
:root {
  --bg:      #f5f2ea;
  --hdr:     #3b3a30;
  --nav-bg:  #e0d8c8;
  --border:  #c8bda8;
  --input-bg:#fffdf7;
  --accent:  #5a7a5a;
  --accent2: #8B3A2A;
  --warn:    #B85C00;
  --muted:   #888;
  --card:    #fff;
  --ink:     #333;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body {
  font-family: system-ui, -apple-system, sans-serif;
  background: var(--bg); color: var(--ink);
  font-size: 14px; padding-bottom: 40px;
}

/* HEADER */
header {
  background: var(--hdr); color: #f5f2ea;
  padding: 44px 14px 10px;
  display: flex; justify-content: space-between; align-items: flex-end;
  position: sticky; top: 0; z-index: 200;
  box-shadow: 0 2px 6px rgba(0,0,0,.3);
}
header h1 { font-size: 17px; }
.rate-status { font-size: 11px; opacity: .7; }

/* NAV */
nav {
  display: flex; overflow-x: auto; scrollbar-width: none;
  background: var(--nav-bg); border-bottom: 1px solid var(--border);
  position: sticky; top: 76px; z-index: 190;
  padding: 6px 10px; gap: 6px;
}
nav::-webkit-scrollbar { display: none; }
nav button {
  flex: none; padding: 7px 12px; border-radius: 6px;
  border: 1px solid var(--border); background: var(--input-bg);
  cursor: pointer; font-size: 13px; white-space: nowrap;
  font-family: inherit;
}
nav button.active { background: var(--hdr); color: #f5f2ea; border-color: var(--hdr); }

/* SECTION */
.section { display: none; padding: 14px; }
.section.active { display: block; }

/* CARD */
.card {
  background: var(--card); border-radius: 10px;
  border: 1px solid var(--border);
  box-shadow: 0 1px 4px rgba(0,0,0,.07);
  margin-bottom: 12px; overflow: hidden;
}
.card-hdr {
  background: var(--hdr); color: #f5f2ea;
  padding: 8px 12px; font-size: 13px; font-weight: 700;
}
.card-body { padding: 12px; }

/* FORM */
label { display: block; font-size: 12px; color: var(--muted); margin-top: 10px; margin-bottom: 3px; }
label:first-child { margin-top: 0; }
input[type=text], input[type=number], select, textarea {
  width: 100%; padding: 9px 10px;
  border: 1px solid var(--border); border-radius: 6px;
  font-size: 15px; font-family: inherit;
  background: var(--input-bg); color: var(--ink);
  outline: none;
}
input:focus, select:focus { border-color: var(--accent); }
textarea { resize: vertical; min-height: 52px; font-size: 13px; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }

/* BUTTONS */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 4px;
  padding: 10px 16px; border-radius: 8px;
  font-size: 14px; font-weight: 700; font-family: inherit;
  border: none; cursor: pointer; transition: opacity .15s;
}
.btn:active { opacity: .7; }
.btn-primary { background: var(--hdr); color: #f5f2ea; }
.btn-accent  { background: var(--accent); color: white; }
.btn-warn    { background: var(--accent2); color: white; }
.btn-gray    { background: #e0d8c8; color: var(--ink); }
.btn-danger  { background: #dc2626; color: white; }
.btn-full    { width: 100%; margin-top: 10px; }
.btn-sm      { padding: 5px 10px; font-size: 12px; font-weight: 600; }

/* CURRENCY PILLS */
.currency-pills { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
.c-pill {
  padding: 8px 14px; border-radius: 20px;
  font-size: 14px; font-weight: 700; font-family: inherit;
  border: 2px solid var(--border); background: var(--input-bg);
  cursor: pointer; transition: all .15s;
}
.c-pill.selected { background: var(--hdr); color: white; border-color: var(--hdr); }

/* CATEGORY PILLS */
.cat-pills { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
.cat-pill {
  padding: 7px 12px; border-radius: 20px;
  font-size: 13px; font-weight: 600; font-family: inherit;
  border: 2px solid var(--border); background: var(--input-bg);
  cursor: pointer; transition: all .15s;
}
.cat-pill.selected { background: var(--accent); color: white; border-color: var(--accent); }

/* PAYMENT PILLS */
.pay-pills { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
.pay-pill {
  padding: 7px 12px; border-radius: 20px;
  font-size: 13px; font-weight: 600; font-family: inherit;
  border: 2px solid var(--border); background: var(--input-bg);
  cursor: pointer; transition: all .15s;
}
.pay-pill.selected { background: var(--accent2); color: white; border-color: var(--accent2); }

/* SUMMARY */
.summary-total {
  text-align: center; padding: 16px;
  background: var(--hdr); color: white;
  border-radius: 10px; margin-bottom: 12px;
}
.summary-total .label { font-size: 12px; opacity: .75; }
.summary-total .amount { font-size: 28px; font-weight: 700; margin-top: 4px; }

.currency-row {
  display: flex; justify-content: space-between; align-items: center;
  padding: 10px 0; border-bottom: 1px solid #f0ebe0;
}
.currency-row:last-child { border-bottom: none; }
.currency-row .cur-code { font-weight: 700; font-size: 15px; }
.currency-row .cur-amt  { font-size: 15px; }
.currency-row .cur-jpy  { font-size: 12px; color: var(--muted); }

/* EXPENSE LIST */
.expense-item {
  display: flex; align-items: flex-start; gap: 10px;
  padding: 10px 0; border-bottom: 1px solid #f0ebe0;
}
.expense-item:last-child { border-bottom: none; }
.exp-cat {
  background: var(--accent); color: white;
  border-radius: 4px; padding: 2px 6px;
  font-size: 11px; font-weight: 700; white-space: nowrap;
}
.exp-info { flex: 1; }
.exp-amount { font-weight: 700; font-size: 15px; text-align: right; }
.exp-jpy    { font-size: 11px; color: var(--muted); text-align: right; }
.exp-meta   { font-size: 11px; color: var(--muted); margin-top: 2px; }

/* FX LIST */
.fx-item {
  display: flex; align-items: center; gap: 8px;
  padding: 10px 0; border-bottom: 1px solid #f0ebe0;
}
.fx-item:last-child { border-bottom: none; }
.fx-badge {
  background: #dbeafe; color: #1e40af;
  border-radius: 4px; padding: 2px 6px;
  font-size: 11px; font-weight: 700; white-space: nowrap;
}
.fx-info { flex: 1; font-size: 13px; }
.fx-meta { font-size: 11px; color: var(--muted); }

/* RATE GRID */
.rate-grid {
  display: grid; grid-template-columns: 1fr 1fr;
  gap: 8px;
}
.rate-item {
  background: var(--input-bg); border: 1px solid var(--border);
  border-radius: 6px; padding: 8px 10px;
  display: flex; justify-content: space-between; align-items: center;
}
.rate-code { font-weight: 700; }
.rate-val  { font-size: 13px; color: var(--muted); }

/* MODAL */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,.5);
  z-index: 1000; display: flex; align-items: flex-end;
  opacity: 0; pointer-events: none; transition: opacity .25s;
}
.modal-overlay.open { opacity: 1; pointer-events: auto; }
.modal-sheet {
  background: var(--bg); border-radius: 16px 16px 0 0;
  width: 100%; max-height: 92vh; overflow-y: auto;
  padding: 16px 14px 40px;
  transform: translateY(100%); transition: transform .3s ease;
}
.modal-overlay.open .modal-sheet { transform: translateY(0); }
.modal-title {
  font-size: 16px; font-weight: 700; margin-bottom: 14px;
  display: flex; justify-content: space-between; align-items: center;
}
.modal-close {
  background: none; border: none; font-size: 22px;
  cursor: pointer; color: var(--muted); padding: 0 4px;
}

/* TOAST */
.toast {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
  background: var(--hdr); color: white;
  padding: 8px 18px; border-radius: 20px;
  font-size: 13px; font-weight: 700;
  opacity: 0; transition: opacity .3s;
  z-index: 9999; white-space: nowrap; pointer-events: none;
}
.toast.show { opacity: 1; }

/* EMPTY */
.empty { text-align: center; padding: 28px 16px; color: var(--muted); font-size: 13px; }

/* SETTINGS LIST */
.setting-row {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 0; border-bottom: 1px solid #f0ebe0;
}
.setting-row:last-child { border-bottom: none; }
.setting-label { flex: 1; font-size: 13px; }
.card-tag { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.card-tag-item {
  background: #e0d8c8; border-radius: 4px;
  padding: 4px 8px; font-size: 12px;
  display: flex; align-items: center; gap: 4px;
}
.card-tag-item button { background: none; border: none; cursor: pointer; font-size: 12px; color: #dc2626; padding: 0; }
</style>
</head>
<body>

<header>
  <h1>✈ 旅行出費記録</h1>
  <span class="rate-status" id="rateStatus">レート取得中...</span>
</header>

<nav>
  <button class="active" data-target="sec-expense">💴 支出入力</button>
  <button data-target="sec-fx">💱 両替/出金</button>
  <button data-target="sec-summary">📊 累計</button>
  <button data-target="sec-list">📋 一覧</button>
  <button data-target="sec-settings">⚙ 設定</button>
</nav>

<!-- ========== 支出入力 ========== -->
<div class="section active" id="sec-expense">
  <div class="card">
    <div class="card-hdr">💴 支出を記録</div>
    <div class="card-body">
      <label>金額</label>
      <input type="number" id="exp-amount" placeholder="0.00" step="0.01" inputmode="decimal">

      <label>通貨</label>
      <div class="currency-pills" id="exp-currency-pills"></div>

      <label>カテゴリ</label>
      <div class="cat-pills" id="exp-cat-pills"></div>

      <label>支払方法</label>
      <div class="pay-pills" id="exp-pay-pills"></div>

      <div class="row2">
        <div>
          <label>国</label>
          <input type="text" id="exp-country" placeholder="例：スイス">
        </div>
        <div>
          <label>都市</label>
          <input type="text" id="exp-city" placeholder="例：ジュネーブ">
        </div>
      </div>

      <label>メモ</label>
      <textarea id="exp-memo" placeholder="任意"></textarea>

      <button class="btn btn-accent btn-full" onclick="addExpense()">✚ 記録する</button>
    </div>
  </div>
</div>

<!-- ========== 両替/出金 ========== -->
<div class="section" id="sec-fx">
  <div class="card">
    <div class="card-hdr">💱 両替・出金を記録</div>
    <div class="card-body">
      <label>出金元</label>
      <div class="pay-pills" id="fx-source-pills"></div>

      <div class="row2">
        <div>
          <label>出金通貨</label>
          <select id="fx-from-cur" onchange="updateFxRatePreview()"></select>
        </div>
        <div>
          <label>出金額</label>
          <input type="number" id="fx-from-amt" placeholder="0" inputmode="decimal" oninput="updateFxRatePreview()">
        </div>
      </div>

      <div class="row2">
        <div>
          <label>受取通貨</label>
          <select id="fx-to-cur" onchange="updateFxRatePreview()"></select>
        </div>
        <div>
          <label>受取額</label>
          <input type="number" id="fx-to-amt" placeholder="0" inputmode="decimal" oninput="updateFxRatePreview()">
        </div>
      </div>

      <div id="fx-rate-preview" style="font-size:12px;color:var(--muted);margin-top:8px;min-height:16px"></div>

      <label>メモ</label>
      <textarea id="fx-memo" placeholder="ATM手数料など"></textarea>

      <button class="btn btn-primary btn-full" onclick="addFx()">✚ 記録する</button>
    </div>
  </div>

  <div class="card">
    <div class="card-hdr">💱 両替・出金履歴</div>
    <div class="card-body" style="padding:0 12px" id="fxList"></div>
  </div>
</div>

<!-- ========== 累計 ========== -->
<div class="section" id="sec-summary">
  <div class="summary-total">
    <div class="label">JPY換算 総支出</div>
    <div class="amount" id="totalJPY">¥ 0</div>
    <div style="font-size:11px;opacity:.6;margin-top:4px" id="rateNote"></div>
  </div>

  <div class="card">
    <div class="card-hdr">通貨別合計</div>
    <div class="card-body" style="padding:0 12px" id="currencySummary"></div>
  </div>

  <div class="card">
    <div class="card-hdr">カテゴリ別合計（JPY換算）</div>
    <div class="card-body" style="padding:0 12px" id="catSummary"></div>
  </div>

  <div style="display:flex;gap:8px;margin-top:4px">
    <button class="btn btn-gray btn-full" onclick="exportCSV()">📥 CSV出力</button>
    <button class="btn btn-gray btn-full" onclick="exportTXT()">📄 テキスト出力</button>
  </div>
</div>

<!-- ========== 一覧 ========== -->
<div class="section" id="sec-list">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
    <span style="font-size:13px;color:var(--muted)" id="listCount"></span>
    <div style="display:flex;gap:6px">
      <button class="btn btn-gray btn-sm" onclick="exportCSV()">📥 CSV</button>
      <button class="btn btn-gray btn-sm" onclick="exportTXT()">📄 テキスト</button>
    </div>
  </div>
  <div class="card">
    <div class="card-body" style="padding:0 12px" id="expenseList"></div>
  </div>
</div>

<!-- ========== 設定 ========== -->
<div class="section" id="sec-settings">
  <div class="card">
    <div class="card-hdr">💳 カード設定</div>
    <div class="card-body">
      <p style="font-size:12px;color:var(--muted);margin-bottom:8px">支払方法に表示するカード名を登録</p>
      <div style="display:flex;gap:6px">
        <input type="text" id="newCard" placeholder="例：SMBC Visa" style="flex:1">
        <button class="btn btn-accent btn-sm" onclick="addCard()">追加</button>
      </div>
      <div class="card-tag" id="cardTagList"></div>
    </div>
  </div>

  <div class="card">
    <div class="card-hdr">🏦 出金元（銀行/口座）設定</div>
    <div class="card-body">
      <p style="font-size:12px;color:var(--muted);margin-bottom:8px">両替・出金の「出金元」に表示する銀行/口座を登録（通貨は自動選択の初期値になります）</p>
      <div class="row2" style="margin-bottom:8px">
        <input type="text" id="newBankName" placeholder="例：Wise">
        <select id="newBankCurrency"></select>
      </div>
      <button class="btn btn-accent btn-sm btn-full" onclick="addBank()">追加</button>
      <div class="card-tag" id="bankTagList"></div>
    </div>
  </div>

  <div class="card">
    <div class="card-hdr">💱 使用通貨の設定</div>
    <div class="card-body">
      <p style="font-size:12px;color:var(--muted);margin-bottom:8px">追加する通貨を選んでください（JPY・EUR・USDは削除不可）</p>
      <div style="display:flex;gap:6px;margin-bottom:10px">
        <select id="newCurrency" style="flex:1"></select>
        <button class="btn btn-accent btn-sm" onclick="addCurrency()">追加</button>
      </div>
      <div class="card-tag" id="currencyTagList"></div>
    </div>
  </div>

  <div class="card">
    <div class="card-hdr">💹 為替レート（対JPY）</div>
    <div class="card-body">
      <div class="rate-grid" id="rateGrid"></div>
      <button class="btn btn-primary btn-full" style="margin-top:10px" onclick="fetchRates()">🔄 レートを更新</button>
    </div>
  </div>

  <div class="card">
    <div class="card-hdr">💾 データ管理</div>
    <div class="card-body">
      <div class="setting-row">
        <span class="setting-label">JSONエクスポート</span>
        <button class="btn btn-accent btn-sm" onclick="exportJSON()">書出し</button>
      </div>
      <div class="setting-row">
        <span class="setting-label">JSONインポート</span>
        <button class="btn btn-gray btn-sm" onclick="document.getElementById('importFile').click()">読込み</button>
        <input type="file" id="importFile" accept=".json" style="display:none" onchange="importJSON(event)">
      </div>
      <div class="setting-row">
        <span class="setting-label">全データ消去</span>
        <button class="btn btn-danger btn-sm" onclick="resetAll()">リセット</button>
      </div>
    </div>
  </div>
</div>

<!-- ========== エクスポートモーダル ========== -->
<div class="modal-overlay" id="exportModal" onclick="closeExportModal(event)">
  <div class="modal-sheet">
    <div class="modal-title">
      <span id="exportModalTitle">📄 エクスポート</span>
      <button class="modal-close" onclick="closeExportModal()">✕</button>
    </div>
    <textarea id="exportContent" readonly
      style="width:100%;height:52vh;font-size:12px;font-family:monospace;
             border:1px solid var(--border);border-radius:8px;padding:10px;
             background:var(--card);color:var(--text);resize:none;"></textarea>
    <div style="display:flex;gap:8px;margin-top:12px">
      <button class="btn btn-accent btn-full" onclick="copyExportContent()">📋 コピー</button>
      <button class="btn btn-gray btn-full" onclick="downloadExportContent()">💾 ファイル保存</button>
    </div>
  </div>
</div>

<!-- ========== 編集モーダル ========== -->
<div class="modal-overlay" id="editModal" onclick="closeEditModal(event)">
  <div class="modal-sheet">
    <div class="modal-title">
      ✏️ 支出を修正
      <button class="modal-close" onclick="closeEditModal()">✕</button>
    </div>

    <input type="hidden" id="edit-id">

    <label>金額</label>
    <input type="number" id="edit-amount" placeholder="0.00" step="0.01" inputmode="decimal">

    <label>通貨</label>
    <div class="currency-pills" id="edit-currency-pills"></div>

    <label>カテゴリ</label>
    <div class="cat-pills" id="edit-cat-pills"></div>

    <label>支払方法</label>
    <div class="pay-pills" id="edit-pay-pills"></div>

    <div class="row2">
      <div>
        <label>国</label>
        <input type="text" id="edit-country" placeholder="例：スイス">
      </div>
      <div>
        <label>都市</label>
        <input type="text" id="edit-city" placeholder="例：ジュネーブ">
      </div>
    </div>

    <label>メモ</label>
    <textarea id="edit-memo" placeholder="任意"></textarea>

    <button class="btn btn-accent btn-full" style="margin-top:14px" onclick="saveEdit()">💾 保存する</button>
  </div>
</div>

<!-- ========== 両替/出金 編集モーダル ========== -->
<div class="modal-overlay" id="editFxModal" onclick="closeEditFxModal(event)">
  <div class="modal-sheet">
    <div class="modal-title">
      ✏️ 両替・出金を修正
      <button class="modal-close" onclick="closeEditFxModal()">✕</button>
    </div>

    <input type="hidden" id="edit-fx-id">

    <label>出金元</label>
    <div class="pay-pills" id="edit-fx-source-pills"></div>

    <div class="row2">
      <div>
        <label>出金通貨</label>
        <select id="edit-fx-from-cur" onchange="updateEditFxRatePreview()"></select>
      </div>
      <div>
        <label>出金額</label>
        <input type="number" id="edit-fx-from-amt" placeholder="0" inputmode="decimal" oninput="updateEditFxRatePreview()">
      </div>
    </div>

    <div class="row2">
      <div>
        <label>受取通貨</label>
        <select id="edit-fx-to-cur" onchange="updateEditFxRatePreview()"></select>
      </div>
      <div>
        <label>受取額</label>
        <input type="number" id="edit-fx-to-amt" placeholder="0" inputmode="decimal" oninput="updateEditFxRatePreview()">
      </div>
    </div>

    <div id="edit-fx-rate-preview" style="font-size:12px;color:var(--muted);margin-top:8px;min-height:16px"></div>

    <label>メモ</label>
    <textarea id="edit-fx-memo" placeholder="ATM手数料など"></textarea>

    <button class="btn btn-accent btn-full" style="margin-top:14px" onclick="saveEditFx()">💾 保存する</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ===== 定数 =====
const DEFAULT_CURRENCIES = ['JPY','EUR','USD'];
const ALL_CURRENCIES = ['JPY','EUR','USD','CHF','GBP','CNY','HKD','SGD','THB','KRW','AUD','CAD','MXN','BRL','INR','TRY','NOK','SEK','DKK','CZK','HUF','PLN','RON'];
// 現在有効な通貨リストは state.currencies で管理
const CATEGORIES = ['食事','交通','宿泊','娯楽教養','日用消耗品','嗜好品','飲酒','通信','治療薬品','衣料','その他'];
const DEFAULT_CARDS = ['Cash'];
const DEFAULT_BANKS = [
  { name: 'Wise',     currency: 'JPY' },
  { name: 'SONY',     currency: 'JPY' },
  { name: 'Citizens', currency: 'USD' },
];

// ===== STATE =====
let state = {
  expenses: [],   // {id, ts, amount, currency, category, payment, country, city, memo}
  fxRecords: [],  // {id, ts, source, fromCur, fromAmt, toCur, toAmt, rate, memo}
  rates: {},      // {EUR:162, ...} JPY基準
  rateUpdated: null,
  cards: [...DEFAULT_CARDS],
  currencies: [...DEFAULT_CURRENCIES], // 使用通貨リスト
  banks: DEFAULT_BANKS.map(b => ({...b})), // 出金元（銀行/口座）リスト
};

// ===== 選択状態 =====
let selCurrency = 'EUR';
let selCategory = '食事';
let selPayment  = 'Cash';
let selFxSource = '';

// 編集モーダル用
let editSelCurrency = 'EUR';
let editSelCategory = '食事';
let editSelPayment  = 'Cash';
let editFxSource = '';

// ===== INIT =====
function init() {
  const saved = localStorage.getItem('travel-expense');
  if (saved) { try { state = JSON.parse(saved); } catch(e) {} }
  // rates がなければデフォルト
  if (!state.rates || Object.keys(state.rates).length === 0) {
    state.rates = {EUR:162, USD:150};
  }
  if (!state.cards || state.cards.length === 0) state.cards = [...DEFAULT_CARDS];
  if (!state.currencies || state.currencies.length === 0) state.currencies = [...DEFAULT_CURRENCIES];
  if (!state.banks || state.banks.length === 0) state.banks = DEFAULT_BANKS.map(b => ({...b}));
  // state.ratesから登録通貨にない古いレートを削除
  Object.keys(state.rates).forEach(cur => {
    if (!state.currencies.includes(cur)) delete state.rates[cur];
  });

  renderCurrencyPills();
  renderCatPills();
  renderPayPills();
  renderFxCurrencySelects();
  renderFxSourcePills();
  renderCards();
  renderCurrencySettings();
  renderBankSettings();
  renderRateGrid();
  renderSummary();
  renderList();
  renderFxList();

  // レート自動取得
  fetchRates();

  // ナビ
  document.querySelectorAll('nav button[data-target]').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
      document.getElementById(btn.dataset.target).classList.add('active');
      if (btn.dataset.target === 'sec-summary') renderSummary();
      if (btn.dataset.target === 'sec-list') renderList();
    });
  });
}

function save() { localStorage.setItem('travel-expense', JSON.stringify(state)); }

// ===== RATES =====
async function fetchRates() {
  document.getElementById('rateStatus').textContent = 'レート取得中...';
  try {
    // Open Exchange Rates (無料・無認証エンドポイント経由)
    const r = await fetch('https://open.er-api.com/v6/latest/JPY');
    const data = await r.json();
    if (data && data.rates) {
      // JPY基準の逆数で各通貨→JPYレートを計算（JPY以外の全登録通貨）
      state.currencies.filter(c => c !== 'JPY').forEach(cur => {
        if (data.rates[cur]) {
          state.rates[cur] = Math.round((1 / data.rates[cur]) * 100) / 100;
        }
      });
      state.rateUpdated = new Date().toISOString();
      save();
      renderRateGrid();
      const t = new Date(state.rateUpdated);
      document.getElementById('rateStatus').textContent =
        `レート更新済 ${t.getHours()}:${String(t.getMinutes()).padStart(2,'0')}`;
      showToast('為替レートを更新しました');
    }
  } catch(e) {
    document.getElementById('rateStatus').textContent = 'オフライン（前回レート使用）';
  }
}

function toJPY(amount, currency) {
  if (currency === 'JPY') return amount;
  return amount * (state.rates[currency] || 1);
}

// ===== CURRENCY PILLS =====
function getCurrencyList() {
  return [...state.currencies.filter(c => c !== 'JPY'), ...(state.currencies.includes('JPY') ? ['JPY'] : [])];
}
function renderCurrencyPills() {
  const list = getCurrencyList();
  if (!list.includes(selCurrency)) selCurrency = list[0] || 'JPY';
  const el = document.getElementById('exp-currency-pills');
  el.innerHTML = list.map(c =>
    `<button class="c-pill ${c===selCurrency?'selected':''}" onclick="pickCurrency('${c}')">${c}</button>`
  ).join('');
}
function pickCurrency(c) { selCurrency = c; renderCurrencyPills(); }

// ===== CAT PILLS =====
function renderCatPills() {
  const el = document.getElementById('exp-cat-pills');
  el.innerHTML = CATEGORIES.map(c =>
    `<button class="cat-pill ${c===selCategory?'selected':''}" onclick="pickCat('${c}')">${c}</button>`
  ).join('');
}
function pickCat(c) { selCategory = c; renderCatPills(); }

// ===== PAY PILLS =====
function renderPayPills() {
  const el = document.getElementById('exp-pay-pills');
  el.innerHTML = state.cards.map(c =>
    `<button class="pay-pill ${c===selPayment?'selected':''}" onclick="pickPay('${c}')">${c}</button>`
  ).join('');
}
function pickPay(c) { selPayment = c; renderPayPills(); }

// ===== FX SOURCE（銀行/口座） =====
function renderFxSourcePills() {
  const el = document.getElementById('fx-source-pills');
  if (!state.banks || state.banks.length === 0) {
    el.innerHTML = '<div style="font-size:12px;color:var(--muted)">設定タブから出金元（銀行/口座）を登録してください</div>';
    selFxSource = '';
    return;
  }
  if (!state.banks.some(b => b.name === selFxSource)) selFxSource = state.banks[0].name;
  el.innerHTML = state.banks.map(b =>
    `<button class="pay-pill ${b.name===selFxSource?'selected':''}" onclick="selectFxSource('${b.name}')">🏦 ${b.name} (${b.currency})</button>`
  ).join('');
}
function selectFxSource(name) {
  selFxSource = name;
  renderFxSourcePills();
  const bank = state.banks.find(b => b.name === name);
  if (bank && document.getElementById('fx-from-cur').querySelector(`option[value="${bank.currency}"]`)) {
    document.getElementById('fx-from-cur').value = bank.currency;
  }
  updateFxRatePreview();
}

// ===== FX CURRENCY SELECTS =====
function renderFxCurrencySelects() {
  const opts = state.currencies.map(c => `<option value="${c}">${c}</option>`).join('');
  document.getElementById('fx-from-cur').innerHTML = opts;
  document.getElementById('fx-to-cur').innerHTML = opts;
  document.getElementById('fx-from-cur').value = state.currencies.includes('JPY') ? 'JPY' : state.currencies[0];
  const toDefault = state.currencies.find(c => c !== 'JPY') || state.currencies[0];
  document.getElementById('fx-to-cur').value = toDefault;
}

// ===== FX 為替レート自動計算 =====
function computeFxRate(fromAmt, fromCur, toAmt, toCur) {
  if (!fromAmt || !toAmt || fromAmt <= 0 || toAmt <= 0) return null;
  if (fromCur === toCur) return null;
  return toAmt / fromAmt; // 1 fromCur = X toCur
}
function updateFxRatePreview() {
  const fromAmt = parseFloat(document.getElementById('fx-from-amt').value);
  const toAmt   = parseFloat(document.getElementById('fx-to-amt').value);
  const fromCur = document.getElementById('fx-from-cur').value;
  const toCur   = document.getElementById('fx-to-cur').value;
  const rate = computeFxRate(fromAmt, fromCur, toAmt, toCur);
  const el = document.getElementById('fx-rate-preview');
  el.textContent = rate ? `💹 レート：1 ${fromCur} = ${rate.toLocaleString(undefined,{maximumFractionDigits:4})} ${toCur}` : '';
}

// ===== ADD EXPENSE =====
function addExpense() {
  const amount = parseFloat(document.getElementById('exp-amount').value);
  if (!amount || amount <= 0) { showToast('金額を入力してください'); return; }

  const exp = {
    id: Date.now() + '_' + Math.random().toString(36).slice(2,6),
    ts: new Date().toISOString(),
    amount,
    currency: selCurrency,
    category: selCategory,
    payment: selPayment,
    country: document.getElementById('exp-country').value.trim(),
    city: document.getElementById('exp-city').value.trim(),
    memo: document.getElementById('exp-memo').value.trim(),
  };

  state.expenses.push(exp);
  save();
  document.getElementById('exp-amount').value = '';
  document.getElementById('exp-memo').value = '';
  showToast(`${selCurrency} ${amount.toLocaleString()} を記録しました`);
  renderSummary();
  renderList();
}

// ===== ADD FX =====
function addFx() {
  const fromAmt = parseFloat(document.getElementById('fx-from-amt').value);
  const toAmt   = parseFloat(document.getElementById('fx-to-amt').value);
  const fromCur = document.getElementById('fx-from-cur').value;
  const toCur   = document.getElementById('fx-to-cur').value;
  if (!fromAmt || !toAmt) { showToast('金額を入力してください'); return; }
  if (!selFxSource) { showToast('出金元を登録・選択してください'); return; }

  const rate = computeFxRate(fromAmt, fromCur, toAmt, toCur);

  const fx = {
    id: Date.now() + '_fx',
    ts: new Date().toISOString(),
    source: selFxSource,
    fromCur, fromAmt, toCur, toAmt, rate,
    memo: document.getElementById('fx-memo').value.trim(),
  };
  state.fxRecords.push(fx);
  save();
  document.getElementById('fx-from-amt').value = '';
  document.getElementById('fx-to-amt').value = '';
  document.getElementById('fx-memo').value = '';
  document.getElementById('fx-rate-preview').textContent = '';
  showToast('両替/出金を記録しました');
  renderFxList();
}

// ===== RENDER SUMMARY =====
function renderSummary() {
  // 通貨別合計
  const byCode = {};
  state.expenses.forEach(e => {
    byCode[e.currency] = (byCode[e.currency] || 0) + e.amount;
  });

  // JPY総計
  let totalJPY = 0;
  Object.entries(byCode).forEach(([cur, amt]) => { totalJPY += toJPY(amt, cur); });

  document.getElementById('totalJPY').textContent = '¥ ' + Math.round(totalJPY).toLocaleString();

  if (state.rateUpdated) {
    const t = new Date(state.rateUpdated);
    document.getElementById('rateNote').textContent =
      `レート更新: ${t.getMonth()+1}/${t.getDate()} ${t.getHours()}:${String(t.getMinutes()).padStart(2,'0')}`;
  }

  // 通貨別
  const curEl = document.getElementById('currencySummary');
  if (Object.keys(byCode).length === 0) {
    curEl.innerHTML = '<div class="empty">記録がありません</div>';
  } else {
    curEl.innerHTML = Object.entries(byCode).map(([cur, amt]) => `
      <div class="currency-row">
        <span class="cur-code">${cur}</span>
        <span>
          <span class="cur-amt">${cur === 'JPY' ? '' : cur+' '}${amt.toLocaleString(undefined,{maximumFractionDigits:2})}</span><br>
          <span class="cur-jpy">≈ ¥${Math.round(toJPY(amt,cur)).toLocaleString()}</span>
        </span>
      </div>
    `).join('');
  }

  // カテゴリ別
  const byCat = {};
  state.expenses.forEach(e => {
    byCat[e.category] = (byCat[e.category] || 0) + toJPY(e.amount, e.currency);
  });
  const catEl = document.getElementById('catSummary');
  if (Object.keys(byCat).length === 0) {
    catEl.innerHTML = '<div class="empty">記録がありません</div>';
  } else {
    const sorted = Object.entries(byCat).sort((a,b) => b[1]-a[1]);
    catEl.innerHTML = sorted.map(([cat, jpy]) => `
      <div class="currency-row">
        <span class="cur-code">${cat}</span>
        <span class="cur-amt">¥${Math.round(jpy).toLocaleString()}</span>
      </div>
    `).join('');
  }
}

// ===== RENDER LIST =====
function renderList() {
  const el = document.getElementById('expenseList');
  document.getElementById('listCount').textContent = `${state.expenses.length}件`;

  if (state.expenses.length === 0) {
    el.innerHTML = '<div class="empty">記録がありません</div>';
    return;
  }

  const sorted = [...state.expenses].reverse();
  el.innerHTML = sorted.map(e => {
    const d = new Date(e.ts);
    const dateStr = `${d.getMonth()+1}/${d.getDate()} ${d.getHours()}:${String(d.getMinutes()).padStart(2,'0')}`;
    const jpy = Math.round(toJPY(e.amount, e.currency));
    const loc = [e.country, e.city].filter(Boolean).join(' ');
    return `
      <div class="expense-item">
        <div>
          <span class="exp-cat">${e.category}</span>
          <div class="exp-meta">${dateStr}${loc?' · '+loc:''} · ${e.payment}</div>
          ${e.memo ? `<div class="exp-meta">${e.memo}</div>` : ''}
        </div>
        <div style="text-align:right;min-width:80px">
          <div class="exp-amount">${e.currency} ${e.amount.toLocaleString(undefined,{maximumFractionDigits:2})}</div>
          ${e.currency!=='JPY'?`<div class="exp-jpy">¥${jpy.toLocaleString()}</div>`:''}
          <div style="display:flex;gap:4px;margin-top:4px;justify-content:flex-end">
            <button class="btn btn-primary btn-sm" onclick="openEditModal('${e.id}')">修正</button>
            <button class="btn btn-danger btn-sm" onclick="deleteExpense('${e.id}')">削除</button>
          </div>
        </div>
      </div>
    `;
  }).join('');
}

// ===== DELETE EXPENSE =====
function deleteExpense(id) {
  if (!confirm('この記録を削除しますか？')) return;
  state.expenses = state.expenses.filter(e => e.id !== id);
  save();
  renderList();
  renderSummary();
  showToast('削除しました');
}

// ===== EDIT MODAL =====
function renderEditCurrencyPills() {
  const list = getCurrencyList();
  const el = document.getElementById('edit-currency-pills');
  el.innerHTML = list.map(c =>
    `<button class="c-pill ${c===editSelCurrency?'selected':''}" onclick="pickEditCurrency('${c}')">${c}</button>`
  ).join('');
}
function pickEditCurrency(c) { editSelCurrency = c; renderEditCurrencyPills(); }

function renderEditCatPills() {
  const el = document.getElementById('edit-cat-pills');
  el.innerHTML = CATEGORIES.map(c =>
    `<button class="cat-pill ${c===editSelCategory?'selected':''}" onclick="pickEditCat('${c}')">${c}</button>`
  ).join('');
}
function pickEditCat(c) { editSelCategory = c; renderEditCatPills(); }

function renderEditPayPills() {
  const el = document.getElementById('edit-pay-pills');
  el.innerHTML = state.cards.map(c =>
    `<button class="pay-pill ${c===editSelPayment?'selected':''}" onclick="pickEditPay('${c}')">${c}</button>`
  ).join('');
}
function pickEditPay(c) { editSelPayment = c; renderEditPayPills(); }

function openEditModal(id) {
  const exp = state.expenses.find(e => e.id === id);
  if (!exp) return;

  document.getElementById('edit-id').value = id;
  document.getElementById('edit-amount').value = exp.amount;
  document.getElementById('edit-country').value = exp.country || '';
  document.getElementById('edit-city').value = exp.city || '';
  document.getElementById('edit-memo').value = exp.memo || '';

  editSelCurrency = exp.currency;
  editSelCategory = exp.category;
  editSelPayment  = exp.payment;

  renderEditCurrencyPills();
  renderEditCatPills();
  renderEditPayPills();

  document.getElementById('editModal').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeEditModal(event) {
  if (event && event.target !== document.getElementById('editModal')) return;
  document.getElementById('editModal').classList.remove('open');
  document.body.style.overflow = '';
}

function saveEdit() {
  const id = document.getElementById('edit-id').value;
  const amount = parseFloat(document.getElementById('edit-amount').value);
  if (!amount || amount <= 0) { showToast('金額を入力してください'); return; }

  const idx = state.expenses.findIndex(e => e.id === id);
  if (idx === -1) return;

  state.expenses[idx] = {
    ...state.expenses[idx],
    amount,
    currency: editSelCurrency,
    category: editSelCategory,
    payment:  editSelPayment,
    country:  document.getElementById('edit-country').value.trim(),
    city:     document.getElementById('edit-city').value.trim(),
    memo:     document.getElementById('edit-memo').value.trim(),
  };

  save();
  document.getElementById('editModal').classList.remove('open');
  document.body.style.overflow = '';
  renderList();
  renderSummary();
  showToast('修正しました');
}

// ===== RENDER FX LIST =====
function renderFxList() {
  const el = document.getElementById('fxList');
  if (state.fxRecords.length === 0) {
    el.innerHTML = '<div class="empty">記録がありません</div>';
    return;
  }
  el.innerHTML = [...state.fxRecords].reverse().map(f => {
    const d = new Date(f.ts);
    const dateStr = `${d.getMonth()+1}/${d.getDate()} ${d.getHours()}:${String(d.getMinutes()).padStart(2,'0')}`;
    const rate = (f.rate != null) ? f.rate : computeFxRate(f.fromAmt, f.fromCur, f.toAmt, f.toCur);
    const rateStr = rate ? `💹 1${f.fromCur} = ${rate.toLocaleString(undefined,{maximumFractionDigits:4})}${f.toCur}` : '';
    return `
      <div class="fx-item">
        <span class="fx-badge">${f.source}</span>
        <div class="fx-info">
          ${f.fromCur} ${f.fromAmt.toLocaleString()} → ${f.toCur} ${f.toAmt.toLocaleString()}
          <div class="fx-meta">${dateStr}${rateStr?' · '+rateStr:''}${f.memo?' · '+f.memo:''}</div>
        </div>
        <div style="display:flex;flex-direction:column;gap:4px">
          <button class="btn btn-primary btn-sm" onclick="openEditFxModal('${f.id}')">修正</button>
          <button class="btn btn-danger btn-sm" onclick="deleteFx('${f.id}')">削除</button>
        </div>
      </div>
    `;
  }).join('');
}

// ===== EDIT FX MODAL =====
function renderEditFxSourcePills() {
  const el = document.getElementById('edit-fx-source-pills');
  if (!state.banks || state.banks.length === 0) {
    el.innerHTML = '<div style="font-size:12px;color:var(--muted)">設定タブから出金元（銀行/口座）を登録してください</div>';
    return;
  }
  el.innerHTML = state.banks.map(b =>
    `<button class="pay-pill ${b.name===editFxSource?'selected':''}" onclick="selectEditFxSource('${b.name}')">🏦 ${b.name} (${b.currency})</button>`
  ).join('');
}
function selectEditFxSource(name) {
  editFxSource = name;
  renderEditFxSourcePills();
  updateEditFxRatePreview();
}
function renderEditFxCurrencySelects(fromCur, toCur) {
  const opts = state.currencies.map(c => `<option value="${c}">${c}</option>`).join('');
  document.getElementById('edit-fx-from-cur').innerHTML = opts;
  document.getElementById('edit-fx-to-cur').innerHTML = opts;
  document.getElementById('edit-fx-from-cur').value = fromCur;
  document.getElementById('edit-fx-to-cur').value = toCur;
}
function updateEditFxRatePreview() {
  const fromAmt = parseFloat(document.getElementById('edit-fx-from-amt').value);
  const toAmt   = parseFloat(document.getElementById('edit-fx-to-amt').value);
  const fromCur = document.getElementById('edit-fx-from-cur').value;
  const toCur   = document.getElementById('edit-fx-to-cur').value;
  const rate = computeFxRate(fromAmt, fromCur, toAmt, toCur);
  const el = document.getElementById('edit-fx-rate-preview');
  el.textContent = rate ? `💹 レート：1 ${fromCur} = ${rate.toLocaleString(undefined,{maximumFractionDigits:4})} ${toCur}` : '';
}

function openEditFxModal(id) {
  const fx = state.fxRecords.find(f => f.id === id);
  if (!fx) return;

  document.getElementById('edit-fx-id').value = id;
  document.getElementById('edit-fx-from-amt').value = fx.fromAmt;
  document.getElementById('edit-fx-to-amt').value = fx.toAmt;
  document.getElementById('edit-fx-memo').value = fx.memo || '';

  editFxSource = fx.source;
  renderEditFxSourcePills();
  renderEditFxCurrencySelects(fx.fromCur, fx.toCur);
  updateEditFxRatePreview();

  document.getElementById('editFxModal').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeEditFxModal(event) {
  if (event && event.target !== document.getElementById('editFxModal')) return;
  document.getElementById('editFxModal').classList.remove('open');
  document.body.style.overflow = '';
}

function saveEditFx() {
  const id = document.getElementById('edit-fx-id').value;
  const fromAmt = parseFloat(document.getElementById('edit-fx-from-amt').value);
  const toAmt   = parseFloat(document.getElementById('edit-fx-to-amt').value);
  const fromCur = document.getElementById('edit-fx-from-cur').value;
  const toCur   = document.getElementById('edit-fx-to-cur').value;
  if (!fromAmt || !toAmt) { showToast('金額を入力してください'); return; }
  if (!editFxSource) { showToast('出金元を選択してください'); return; }

  const idx = state.fxRecords.findIndex(f => f.id === id);
  if (idx === -1) return;

  const rate = computeFxRate(fromAmt, fromCur, toAmt, toCur);

  state.fxRecords[idx] = {
    ...state.fxRecords[idx],
    source: editFxSource,
    fromCur, fromAmt, toCur, toAmt, rate,
    memo: document.getElementById('edit-fx-memo').value.trim(),
  };

  save();
  document.getElementById('editFxModal').classList.remove('open');
  document.body.style.overflow = '';
  renderFxList();
  showToast('修正しました');
}

function deleteFx(id) {
  if (!confirm('削除しますか？')) return;
  state.fxRecords = state.fxRecords.filter(f => f.id !== id);
  save();
  renderFxList();
  showToast('削除しました');
}

// ===== CARDS =====
function addCard() {
  const val = document.getElementById('newCard').value.trim();
  if (!val) return;
  if (state.cards.includes(val)) { showToast('すでに登録済みです'); return; }
  state.cards.push(val);
  save();
  document.getElementById('newCard').value = '';
  renderCards();
  renderPayPills();
  showToast(`${val} を追加しました`);
}

function deleteCard(name) {
  if (name === 'Cash') { showToast('Cashは削除できません'); return; }
  state.cards = state.cards.filter(c => c !== name);
  if (selPayment === name) selPayment = 'Cash';
  save();
  renderCards();
  renderPayPills();
}

function renderCards() {
  const el = document.getElementById('cardTagList');
  el.innerHTML = state.cards.map(c => `
    <span class="card-tag-item">
      ${c}
      <button onclick="deleteCard('${c}')" title="削除">✕</button>
    </span>
  `).join('');
}

// ===== BANK (出金元) MANAGEMENT =====
function renderBankSettings() {
  const curSel = document.getElementById('newBankCurrency');
  curSel.innerHTML = state.currencies.map(c => `<option value="${c}">${c}</option>`).join('');

  const el = document.getElementById('bankTagList');
  if (!state.banks || state.banks.length === 0) {
    el.innerHTML = '<div style="font-size:12px;color:var(--muted)">出金元が登録されていません</div>';
    return;
  }
  el.innerHTML = state.banks.map(b => `
    <span class="card-tag-item">
      🏦 ${b.name} (${b.currency})
      <button onclick="deleteBank('${b.name}')" title="削除">✕</button>
    </span>
  `).join('');
}

function addBank() {
  const nameInput = document.getElementById('newBankName');
  const name = nameInput.value.trim();
  const currency = document.getElementById('newBankCurrency').value;
  if (!name) { showToast('銀行/口座名を入力してください'); return; }
  if (state.banks.some(b => b.name === name)) { showToast('すでに登録済みです'); return; }
  state.banks.push({ name, currency });
  save();
  nameInput.value = '';
  renderBankSettings();
  renderFxSourcePills();
  showToast(`${name} を追加しました`);
}

function deleteBank(name) {
  state.banks = state.banks.filter(b => b.name !== name);
  if (selFxSource === name) selFxSource = state.banks[0] ? state.banks[0].name : '';
  save();
  renderBankSettings();
  renderFxSourcePills();
  showToast(`${name} を削除しました`);
}

// ===== CURRENCY MANAGEMENT =====
const LOCKED_CURRENCIES = ['JPY','EUR','USD'];

function renderCurrencySettings() {
  // セレクトに未追加の通貨を列挙
  const sel = document.getElementById('newCurrency');
  const available = ALL_CURRENCIES.filter(c => !state.currencies.includes(c));
  sel.innerHTML = available.map(c => `<option value="${c}">${c}</option>`).join('');

  // タグリスト
  const el = document.getElementById('currencyTagList');
  el.innerHTML = state.currencies.map(c => `
    <span class="card-tag-item">
      ${c}
      ${LOCKED_CURRENCIES.includes(c)
        ? '<span style="color:var(--muted);font-size:10px">固定</span>'
        : `<button onclick="deleteCurrency('${c}')" title="削除">✕</button>`}
    </span>
  `).join('');
}

function addCurrency() {
  const val = document.getElementById('newCurrency').value;
  if (!val) return;
  if (state.currencies.includes(val)) { showToast('すでに追加済みです'); return; }
  state.currencies.push(val);
  save();
  renderCurrencySettings();
  renderCurrencyPills();
  renderFxCurrencySelects();
  renderBankSettings();
  renderRateGrid();   // 追加直後にグリッドへ反映（レートは「取得中…」表示）
  fetchRates();       // API取得後に実レートで上書き
  showToast(`${val} を追加しました`);
}

function deleteCurrency(cur) {
  if (LOCKED_CURRENCIES.includes(cur)) { showToast(`${cur}は削除できません`); return; }
  state.currencies = state.currencies.filter(c => c !== cur);
  delete state.rates[cur];
  if (selCurrency === cur) selCurrency = getCurrencyList()[0] || 'JPY';
  save();
  renderCurrencySettings();
  renderCurrencyPills();
  renderFxCurrencySelects();
  renderBankSettings();
  showToast(`${cur} を削除しました`);
}

// ===== RATE GRID =====
function renderRateGrid() {
  const el = document.getElementById('rateGrid');
  const targets = state.currencies.filter(c => c !== 'JPY');
  if (targets.length === 0) {
    el.innerHTML = '<div style="font-size:12px;color:var(--muted)">通貨が登録されていません</div>';
    return;
  }
  el.innerHTML = targets.map(cur => {
    const rate = state.rates[cur];
    const val = rate ? '\xA5' + rate : '取得中…';
    return `<div class="rate-item"><span class="rate-code">${cur}</span><span class="rate-val">1${cur} = ${val}</span></div>`;
  }).join('');
}

// ===== EXPORT =====
function exportJSON() {
  const blob = new Blob([JSON.stringify(state, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `travel_expense_${new Date().toISOString().slice(0,10)}.json`;
  a.click();
}

function importJSON(evt) {
  const file = evt.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const obj = JSON.parse(e.target.result);
      state = obj;
      save();
      init();
      showToast('インポートしました');
    } catch { showToast('読込エラー'); }
  };
  reader.readAsText(file);
}

// ===== EXPORT MODAL =====
let exportFilename = '';
let exportMimeType = '';

function openExportModal(title, content, filename, mime) {
  exportFilename = filename;
  exportMimeType = mime;
  document.getElementById('exportModalTitle').textContent = title;
  document.getElementById('exportContent').value = content;
  document.getElementById('exportModal').classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeExportModal(event) {
  if (event && event.target !== document.getElementById('exportModal')) return;
  document.getElementById('exportModal').classList.remove('open');
  document.body.style.overflow = '';
}
function copyExportContent() {
  const ta = document.getElementById('exportContent');
  ta.select();
  navigator.clipboard.writeText(ta.value).then(() => showToast('コピーしました'))
    .catch(() => { document.execCommand('copy'); showToast('コピーしました'); });
}
function downloadExportContent() {
  const content = document.getElementById('exportContent').value;
  const bom = exportMimeType.includes('csv') ? '\uFEFF' : '';
  const blob = new Blob([bom + content], {type: exportMimeType});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = exportFilename;
  a.click();
  showToast('ファイルを保存しました');
}

function exportCSV() {
  const rows = [['日時','金額','通貨','JPY換算','カテゴリ','支払方法','国','都市','メモ']];
  state.expenses.forEach(e => {
    rows.push([
      new Date(e.ts).toLocaleString('ja'),
      e.amount, e.currency,
      Math.round(toJPY(e.amount, e.currency)),
      e.category, e.payment, e.country, e.city, e.memo
    ]);
  });
  const csv = rows.map(r => r.map(v => `"${String(v||'').replace(/"/g,'""')}"`).join(',')).join('\n');
  const filename = `travel_expense_${new Date().toISOString().slice(0,10)}.csv`;
  openExportModal('📥 CSV出力', csv, filename, 'text/csv');
}

function exportTXT() {
  const date = new Date().toLocaleDateString('ja-JP');
  const lines = [`旅行出費記録　${date}`, '='.repeat(40), ''];

  // 集計
  const byCode = {};
  const byCat  = {};
  let totalJPY = 0;
  state.expenses.forEach(e => {
    byCode[e.currency] = (byCode[e.currency] || 0) + e.amount;
    byCat[e.category]  = (byCat[e.category]  || 0) + toJPY(e.amount, e.currency);
    totalJPY += toJPY(e.amount, e.currency);
  });

  lines.push(`【JPY換算 総支出】  ¥${Math.round(totalJPY).toLocaleString()}`);
  lines.push('');

  lines.push('【通貨別合計】');
  Object.entries(byCode).forEach(([cur, amt]) => {
    lines.push(`  ${cur.padEnd(4)} ${amt.toLocaleString(undefined,{maximumFractionDigits:2}).padStart(12)}  ≈ ¥${Math.round(toJPY(amt,cur)).toLocaleString()}`);
  });
  lines.push('');

  lines.push('【カテゴリ別合計（JPY換算）】');
  Object.entries(byCat).sort((a,b) => b[1]-a[1]).forEach(([cat, jpy]) => {
    lines.push(`  ${cat.padEnd(8)}  ¥${Math.round(jpy).toLocaleString()}`);
  });
  lines.push('');
  lines.push('-'.repeat(40));
  lines.push('【明細一覧】');
  lines.push('');

  [...state.expenses].reverse().forEach(e => {
    const d = new Date(e.ts);
    const ds = `${d.getMonth()+1}/${d.getDate()} ${d.getHours()}:${String(d.getMinutes()).padStart(2,'0')}`;
    const loc = [e.country, e.city].filter(Boolean).join(' ');
    const jpy = Math.round(toJPY(e.amount, e.currency));
    lines.push(`${ds}  [${e.category}]  ${e.currency} ${e.amount.toLocaleString(undefined,{maximumFractionDigits:2})}  ≈ ¥${jpy.toLocaleString()}`);
    lines.push(`       ${e.payment}${loc?' · '+loc:''}${e.memo?' · '+e.memo:''}`);
    lines.push('');
  });

  const filename = `travel_expense_${new Date().toISOString().slice(0,10)}.txt`;
  openExportModal('📄 テキスト出力', lines.join('\n'), filename, 'text/plain;charset=utf-8');
}

function resetAll() {
  if (!confirm('全データを消去しますか？')) return;
  state = {
    expenses:[], fxRecords:[],
    rates:{EUR:162, USD:150},
    rateUpdated: null, cards:[...DEFAULT_CARDS],
    currencies:[...DEFAULT_CURRENCIES],
    banks: DEFAULT_BANKS.map(b => ({...b})),
  };
  save(); init();
  showToast('リセットしました');
}

// ===== TOAST =====
let toastTimer;
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
}

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/Euro2026/sw.js')
      .then(() => console.log('SW registered'))
      .catch(e => console.log('SW failed:', e));
  });
}

init();
