<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>郵便受けログ</title>
<style>
html, body { margin: 0; padding: 0; width: 100%; background: #EAE6DD; }
#postlog-root, #postlog-root * { box-sizing: border-box; }
#postlog-root {
  --paper: #EAE6DD;
  --paper-deep: #DFDACD;
  --ink: #20242E;
  --ink-soft: #6B7080;
  --card: #FFFFFF;
  --border: #D6D0C0;
  --yellow: #FFCE00;
  --yellow-deep: #E0AE00;
  --red: #C31F3D;
  --green: #2F6E4F;
  --radius: 10px;
  font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
  color: var(--ink);
  background: var(--paper);
  min-height: 100vh;
  padding-top: env(safe-area-inset-top);
  padding-bottom: 0;
  -webkit-font-smoothing: antialiased;
}
#postlog-root .heading-font { font-family: 'Space Grotesk', 'Hiragino Sans', sans-serif; }

#postlog-root .wrap { max-width: 560px; margin: 0 auto; padding: 18px 16px calc(96px + env(safe-area-inset-bottom)) 16px; }

/* Header */
#postlog-root .app-header {
  display: flex; align-items: flex-start; justify-content: space-between;
  padding: 4px 2px 18px 2px; border-bottom: 2px solid var(--ink);
  margin-bottom: 14px;
}
#postlog-root .app-title { font-size: 21px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.15; }
#postlog-root .app-sub { font-size: 11px; color: var(--ink-soft); margin-top: 4px; letter-spacing: 0.02em; }
#postlog-root .app-badge {
  background: var(--yellow); color: var(--ink); font-size: 10px; font-weight: 700;
  padding: 5px 8px; border-radius: 3px; border: 1.5px solid var(--ink);
  transform: rotate(2deg); white-space: nowrap;
}

/* Tabs */
#postlog-root .tabs { display: flex; gap: 8px; margin-bottom: 16px; }
#postlog-root .tab-btn {
  flex: 1; padding: 10px 8px; font-family: inherit; font-size: 12px; font-weight: 700;
  background: transparent; border: 1.5px solid var(--ink); border-radius: var(--radius);
  color: var(--ink); cursor: pointer; letter-spacing: 0.01em;
}
#postlog-root .tab-btn.active { background: var(--ink); color: var(--paper); }
#postlog-root .tab-count { opacity: 0.6; font-weight: 500; }

/* List */
#postlog-root .empty-state {
  border: 1.5px dashed var(--border); border-radius: var(--radius); padding: 32px 18px;
  text-align: center; color: var(--ink-soft); font-size: 12.5px; line-height: 1.7;
}
#postlog-root .entry-card {
  background: var(--card); border: 1.5px solid var(--ink); border-radius: var(--radius);
  padding: 12px; margin-bottom: 10px; display: flex; gap: 12px; position: relative;
  overflow: hidden;
}
#postlog-root .entry-thumb {
  width: 64px; height: 64px; border-radius: 6px; object-fit: cover; flex-shrink: 0;
  border: 1px solid var(--border); background: var(--paper-deep);
}
#postlog-root .entry-thumb.placeholder { display: flex; align-items: center; justify-content: center; font-size: 22px; color: var(--ink-soft); }
#postlog-root .entry-body { flex: 1; min-width: 0; }
#postlog-root .entry-top { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
#postlog-root .entry-sender { font-size: 13.5px; font-weight: 700; overflow-wrap: anywhere; }
#postlog-root .entry-date { font-size: 10.5px; color: var(--ink-soft); white-space: nowrap; }
#postlog-root .entry-memo { font-size: 11.5px; color: var(--ink-soft); margin-top: 3px; overflow-wrap: anywhere; }
#postlog-root .entry-tags { display: flex; gap: 6px; margin-top: 7px; flex-wrap: wrap; }
#postlog-root .tag {
  font-size: 9.5px; font-weight: 700; padding: 3px 7px; border-radius: 20px; border: 1px solid currentColor;
}
#postlog-root .tag.pending { color: var(--red); }
#postlog-root .tag.open-req { color: var(--yellow-deep); }
#postlog-root .tag.reported { color: var(--green); }
#postlog-root .entry-actions { display: flex; gap: 6px; margin-top: 8px; }
#postlog-root .mini-btn {
  font-family: inherit; font-size: 10px; font-weight: 700; padding: 5px 8px;
  border-radius: 6px; border: 1px solid var(--ink); background: transparent; color: var(--ink); cursor: pointer;
}
#postlog-root .mini-btn.danger { border-color: var(--red); color: var(--red); }

/* Stamp */
#postlog-root .stamp {
  position: absolute; top: 8px; right: 10px; width: 62px; height: 62px;
  border: 2.5px solid var(--red); border-radius: 50%; color: var(--red);
  display: flex; align-items: center; justify-content: center; text-align: center;
  font-family: 'Space Grotesk', sans-serif; font-size: 8.5px; font-weight: 700;
  transform: rotate(-14deg); opacity: 0.85; line-height: 1.25; letter-spacing: 0.03em;
  pointer-events: none; mix-blend-mode: multiply;
}
#postlog-root .stamp::before {
  content: ''; position: absolute; inset: 5px; border: 1px solid var(--red); border-radius: 50%;
}

/* FAB */
#postlog-root .fab-row {
  position: fixed; left: 0; right: 0; bottom: calc(18px + env(safe-area-inset-bottom));
  display: flex; justify-content: center; align-items: center; gap: 10px; padding: 0 16px;
  z-index: 40; pointer-events: none;
}
#postlog-root .fab-row > * { pointer-events: auto; }
#postlog-root .fab {
  background: var(--ink); color: var(--yellow); border: none; border-radius: 30px;
  padding: 14px 22px; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 14px;
  display: flex; align-items: center; gap: 8px; cursor: pointer; box-shadow: 0 6px 18px rgba(0,0,0,0.25);
  white-space: nowrap;
}
#postlog-root .fab-secondary {
  background: var(--card); color: var(--ink);
  border: 1.5px solid var(--ink); border-radius: 30px; padding: 12px 16px; font-size: 12px;
  font-weight: 700; font-family: inherit; cursor: pointer; white-space: nowrap;
}
#postlog-root .header-icon-btn {
  background: var(--card); border: 1.5px solid var(--ink); border-radius: 20px; width: 34px; height: 34px;
  font-size: 15px; cursor: pointer; margin-left: 8px; flex-shrink: 0;
}
#postlog-root .badge-row { display: flex; align-items: flex-start; }
#postlog-root .data-section { border: 1.5px solid var(--border); border-radius: var(--radius); padding: 14px; margin-bottom: 12px; background: var(--card); }
#postlog-root .data-section h4 { font-family: 'Space Grotesk', sans-serif; font-size: 13px; margin: 0 0 6px 0; }
#postlog-root .data-section p { font-size: 11px; color: var(--ink-soft); line-height: 1.6; margin: 0 0 10px 0; }
#postlog-root .item-share-row {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding: 9px 0; border-bottom: 1px solid var(--border);
}
#postlog-root .item-share-row:last-child { border-bottom: none; }
#postlog-root .item-share-info { min-width: 0; }
#postlog-root .item-share-label { font-size: 12.5px; font-weight: 700; overflow-wrap: anywhere; }
#postlog-root .item-share-date { font-size: 10.5px; color: var(--ink-soft); margin-top: 2px; }

/* Modal */
#postlog-root .modal-veil {
  position: fixed; inset: 0; background: rgba(20,20,24,0.55); z-index: 50;
  display: flex; align-items: flex-end; justify-content: center;
}
#postlog-root .modal-sheet {
  background: var(--paper); width: 100%; max-width: 560px; max-height: 92vh; overflow-y: auto;
  border-radius: 18px 18px 0 0; padding: 18px 16px calc(28px + env(safe-area-inset-bottom)) 16px; border-top: 2.5px solid var(--ink);
}
#postlog-root .modal-title { font-family: 'Space Grotesk', sans-serif; font-size: 16px; font-weight: 700; margin-bottom: 14px; }
#postlog-root .field { margin-bottom: 12px; }
#postlog-root .field label { display: block; font-size: 10.5px; font-weight: 700; color: var(--ink-soft); margin-bottom: 5px; letter-spacing: 0.03em; text-transform: uppercase; }
#postlog-root .field input[type="text"], #postlog-root .field textarea, #postlog-root .field select {
  width: 100%; font-family: inherit; font-size: 13px; padding: 9px 10px; border-radius: 7px;
  border: 1.5px solid var(--border); background: var(--card); color: var(--ink);
}
#postlog-root .field textarea { min-height: 64px; resize: vertical; }
#postlog-root .photo-zone {
  border: 1.5px dashed var(--border); border-radius: var(--radius); padding: 14px; text-align: center;
  margin-bottom: 12px; background: var(--card);
}
#postlog-root .photo-preview { max-width: 100%; max-height: 220px; border-radius: 8px; margin-bottom: 10px; display: none; }
#postlog-root .capture-btn {
  font-family: inherit; font-weight: 700; font-size: 12.5px; padding: 10px 16px;
  border-radius: 8px; border: 1.5px solid var(--ink); background: var(--yellow); color: var(--ink); cursor: pointer;
}
#postlog-root .ocr-status { font-size: 11px; color: var(--ink-soft); margin-top: 8px; min-height: 14px; }
#postlog-root .modal-actions { display: flex; gap: 8px; margin-top: 16px; }
#postlog-root .btn-primary {
  flex: 1; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 13.5px;
  padding: 12px; border-radius: 8px; border: none; background: var(--ink); color: var(--paper); cursor: pointer;
}
#postlog-root .btn-ghost {
  font-family: inherit; font-weight: 700; font-size: 12.5px; padding: 12px 14px;
  border-radius: 8px; border: 1.5px solid var(--ink); background: transparent; color: var(--ink); cursor: pointer;
}
#postlog-root .related-pick { display: flex; flex-direction: column; gap: 6px; max-height: 160px; overflow-y: auto; }
#postlog-root .related-opt {
  border: 1.5px solid var(--border); border-radius: 8px; padding: 8px 10px; font-size: 12px; cursor: pointer; background: var(--card);
}
#postlog-root .related-opt.selected { border-color: var(--ink); background: var(--yellow); }

/* Report modal */
#postlog-root .report-text {
  width: 100%; min-height: 220px; font-family: inherit; font-size: 12px; padding: 12px;
  border-radius: 8px; border: 1.5px solid var(--border); background: var(--card); white-space: pre-wrap;
}
#postlog-root .toast {
  position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--paper);
  padding: 9px 16px; border-radius: 20px; font-size: 12px; font-weight: 700; z-index: 60; opacity: 0; transition: opacity 0.25s;
  pointer-events: none;
}
#postlog-root .toast.show { opacity: 1; }
</style>
</head>
<body>
<div id="postlog-root"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/5.0.4/tesseract.min.js"></script>
<script>
(function(){
  const root = document.getElementById('postlog-root');
  let tab = 'envelope'; // 'envelope' | 'opened'
  let data = { envelope: [], opened: [] };
  let modalMode = null; // 'add-envelope' | 'add-opened' | 'edit-envelope' | 'edit-opened'
  let draft = { photo: null, sender: '', memo: '', ocrText: '', relatedId: null, openRequested: false, editId: null };
  let dataModalOpen = false;
  let importPreviewOpen = false;
  let importPreviewData = null; // { envelope: [...], opened: [...] }

  const KEY = (t, id) => `postlog:${t}:${id}`;
  const IDX = (t) => `postlog:${t}:index`;
  const LS_PREFIX = 'postlog_v1__';

  function lsGet(key){ try { return localStorage.getItem(LS_PREFIX + key); } catch(e){ return null; } }
  function lsSet(key, value){ try { localStorage.setItem(LS_PREFIX + key, value); return true; } catch(e){ return false; } }
  function lsDelete(key){ try { localStorage.removeItem(LS_PREFIX + key); } catch(e){} }

  async function loadAll(){
    for (const t of ['envelope','opened']) {
      try {
        const idxRaw = lsGet(IDX(t));
        const ids = idxRaw ? JSON.parse(idxRaw) : [];
        const items = [];
        for (const id of ids) {
          const raw = lsGet(KEY(t, id));
          if (raw) items.push(JSON.parse(raw));
        }
        items.sort((a,b) => b.createdAt - a.createdAt);
        data[t] = items;
      } catch(e) { data[t] = []; }
    }
    render();
  }

  function saveEntry(t, entry){
    const ok = lsSet(KEY(t, entry.id), JSON.stringify(entry));
    if (!ok) { toast('⚠ 保存容量の上限です。⚙データ管理から書き出して削除してください'); return false; }
    const idxRaw = lsGet(IDX(t));
    const ids = idxRaw ? JSON.parse(idxRaw) : [];
    if (!ids.includes(entry.id)) { ids.push(entry.id); lsSet(IDX(t), JSON.stringify(ids)); }
    return true;
  }

  function deleteEntry(t, id){
    lsDelete(KEY(t, id));
    const idxRaw = lsGet(IDX(t));
    let ids = idxRaw ? JSON.parse(idxRaw) : [];
    ids = ids.filter(x => x !== id);
    lsSet(IDX(t), JSON.stringify(ids));
    data[t] = data[t].filter(e => e.id !== id);
    render();
  }

  function fmtDate(ts){
    const d = new Date(ts);
    const pad = n => String(n).padStart(2,'0');
    return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
  }

  function compressImage(file){
    return new Promise((resolve, reject) => {
      const img = new Image();
      const reader = new FileReader();
      reader.onload = e => { img.onload = () => {
        const maxW = 640;
        const scale = Math.min(1, maxW / img.width);
        const w = Math.round(img.width * scale), h = Math.round(img.height * scale);
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', 0.55));
      }; img.onerror = reject; img.src = e.target.result; };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  async function runOcr(dataUrl, statusEl){
    if (!window.Tesseract) { statusEl.textContent = 'OCRライブラリを読み込めませんでした（手動入力してください）'; return ''; }
    try {
      statusEl.textContent = '文字認識中…（回線状況により時間がかかる場合があります）';
      const result = await Tesseract.recognize(dataUrl, 'jpn+deu+eng+fra+spa', {});
      const text = (result && result.data && result.data.text || '').trim();
      statusEl.textContent = text ? '認識完了。内容を確認・修正してください。' : '文字を認識できませんでした。手動入力してください。';
      return text;
    } catch(e) {
      statusEl.textContent = 'OCRに失敗しました（ネットワーク制限の可能性）。手動入力してください。';
      return '';
    }
  }

  function toast(msg){
    let el = root.querySelector('.toast');
    if (!el) { el = document.createElement('div'); el.className = 'toast'; root.appendChild(el); }
    el.textContent = msg; el.classList.add('show');
    clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove('show'), 2200);
  }

  function openModal(mode, existing){
    modalMode = mode;
    if (existing) {
      draft = {
        photo: existing.photo || null,
        sender: existing.sender || '',
        memo: existing.memo || '',
        ocrText: existing.ocrText || '',
        relatedId: existing.relatedId || null,
        openRequested: !!existing.openRequested,
        editId: existing.id
      };
    } else {
      draft = { photo: null, sender: '', memo: '', ocrText: '', relatedId: null, openRequested: false, editId: null };
    }
    render();
  }
  function closeModal(){ modalMode = null; render(); }

  // ショートカット連携：URLに ?ocr=認識済みテキスト（&type=envelope|opened）を付けて開くと、
  // 新規記録モーダルが自動で開き、テキストが差出人欄・認識テキスト欄にプリセットされる。
  // 同時にクリップボードから写真を自動読み取りしてプレビューにセットする。
  async function handleIncomingParams(){
    const params = new URLSearchParams(window.location.search);
    const ocrParam = params.get('ocr');
    if (!ocrParam) return;
    const text = decodeURIComponent(ocrParam);
    const typeParam = params.get('type') === 'opened' ? 'opened' : 'envelope';
    tab = typeParam;
    const guessSender = text.split('\n').map(s => s.trim()).filter(Boolean)[0] || '';
    openModal(typeParam === 'envelope' ? 'add-envelope' : 'add-opened', {
      sender: guessSender,
      ocrText: text
    });
    // URLをきれいにしておく（リロード時の二重取り込みや共有時の混乱を防ぐ）
    const cleanUrl = window.location.pathname;
    window.history.replaceState({}, document.title, cleanUrl);

    // クリップボードから写真を自動読み取り
    // ショートカット側で「写真をクリップボードにコピー」してからURLを開いた場合に自動でセットされる
    try {
      if (navigator.clipboard && navigator.clipboard.read) {
        const items = await navigator.clipboard.read();
        for (const item of items) {
          for (const type of item.types) {
            if (type.startsWith('image/')) {
              const blob = await item.getType(type);
              const file = new File([blob], 'clipboard.jpg', { type: blob.type || 'image/jpeg' });
              const dataUrl = await compressImage(file);
              draft.photo = dataUrl;
              // モーダルが描画された後にプレビューを更新
              render();
              const preview = root.querySelector('#f-preview');
              if (preview) { preview.src = dataUrl; preview.style.display = 'block'; }
              const statusEl = root.querySelector('#f-ocr-status');
              if (statusEl) statusEl.textContent = '写真をクリップボードから読み込みました。';
              toast('写真とテキストを自動入力しました');
              return; // 画像が見つかったら終了
            }
          }
        }
      }
    } catch(err) {
      // クリップボードへのアクセス権限がない・画像がない場合は無視
      // テキストだけでモーダルが開いている状態で続行
    }
  }


  async function handleSaveEnvelope(){
    const senderInput = root.querySelector('#f-sender');
    const memoInput = root.querySelector('#f-memo');
    const ocrTextInput = root.querySelector('#f-ocrtext');
    const openReq = root.querySelector('#f-openreq').checked;
    let entry;
    if (draft.editId) {
      entry = data.envelope.find(e => e.id === draft.editId);
      if (!entry) return;
      entry.sender = senderInput.value.trim() || '(不明)';
      entry.memo = memoInput.value.trim();
      entry.ocrText = ocrTextInput.value;
      entry.photo = draft.photo;
      entry.openRequested = openReq;
    } else {
      entry = {
        id: 'e' + Date.now(),
        createdAt: Date.now(),
        sender: senderInput.value.trim() || '(不明)',
        memo: memoInput.value.trim(),
        ocrText: ocrTextInput.value,
        photo: draft.photo,
        openRequested: openReq,
        reported: false,
        reportDate: null,
        exported: false
      };
      data.envelope.unshift(entry);
    }
    const ok = saveEntry('envelope', entry);
    if (!ok) { if (!draft.editId) data.envelope.shift(); return; }
    closeModal();
    toast(draft.editId ? '修正しました' : '記録しました');
  }

  async function handleSaveOpened(){
    const memoInput = root.querySelector('#f-memo');
    const ocrTextInput = root.querySelector('#f-ocrtext-o');
    if (!draft.relatedId) { toast('対応する郵便物を選んでください'); return; }
    let entry;
    if (draft.editId) {
      entry = data.opened.find(e => e.id === draft.editId);
      if (!entry) return;
      entry.relatedId = draft.relatedId;
      entry.memo = memoInput.value.trim();
      entry.ocrText = ocrTextInput ? ocrTextInput.value : entry.ocrText;
      entry.photo = draft.photo;
    } else {
      entry = {
        id: 'o' + Date.now(),
        createdAt: Date.now(),
        relatedId: draft.relatedId,
        memo: memoInput.value.trim(),
        ocrText: draft.ocrText,
        photo: draft.photo,
        reported: false,
        reportDate: null,
        exported: false
      };
      data.opened.unshift(entry);
    }
    const ok = saveEntry('opened', entry);
    if (!ok) { if (!draft.editId) data.opened.shift(); return; }
    closeModal();
    toast(draft.editId ? '修正しました' : '開封記録を保存しました');
  }

  async function markReported(t, id){
    const entry = data[t].find(e => e.id === id);
    if (!entry) return;
    entry.reported = true;
    entry.reportDate = Date.now();
    await saveEntry(t, entry);
    render();
  }

  async function markUnreported(t, id){
    const entry = data[t].find(e => e.id === id);
    if (!entry) return;
    entry.reported = false;
    entry.reportDate = null;
    await saveEntry(t, entry);
    render();
    toast('未報告に戻しました');
  }

  function unreportedEntries(t){ return data[t].filter(e => !e.reported); }

  async function exportAll(){
    const totalCount = data.envelope.length + data.opened.length;
    if (!totalCount) { toast('書き出す記録がありません'); return; }
    const payload = {
      exportedAt: new Date().toISOString(),
      note: 'Berlin Briefkasten Protokoll export',
      envelope: data.envelope,
      opened: data.opened
    };
    const json = JSON.stringify(payload, null, 2);
    const blob = new Blob([json], { type: 'application/json' });
    const filename = `postlog-export-${new Date().toISOString().slice(0,10)}.json`;

    let shared = false;
    try {
      if (navigator.canShare) {
        const file = new File([blob], filename, { type: 'application/json' });
        if (navigator.canShare({ files: [file] })) {
          await navigator.share({ files: [file], title: filename });
          shared = true;
        }
      }
    } catch(e) { /* user cancelled */ shared = true; }

    if (!shared) {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 4000);
    }

    for (const t of ['envelope','opened']) {
      for (const e of data[t]) { e.exported = true; await saveEntry(t, e); }
    }
    render();
    toast('書き出しました');
  }

  async function clearExported(){
    for (const t of ['envelope','opened']) {
      const toDelete = data[t].filter(e => e.exported).map(e => e.id);
      for (const id of toDelete) lsDelete(KEY(t, id));
      const idxRaw = lsGet(IDX(t));
      let ids = idxRaw ? JSON.parse(idxRaw) : [];
      ids = ids.filter(id => !toDelete.includes(id));
      lsSet(IDX(t), JSON.stringify(ids));
      data[t] = data[t].filter(e => !e.exported);
    }
    dataModalOpen = false;
    render();
    toast('書き出し済みの記録を削除しました');
  }

  const SETTINGS_KEY = 'postlog_v1__settings';
  function loadSettings(){
    try { const raw = localStorage.getItem(SETTINGS_KEY); return raw ? JSON.parse(raw) : { to: '', cc: '', whatsapp: '' }; }
    catch(e) { return { to: '', cc: '', whatsapp: '' }; }
  }
  function saveSettings(s){
    try { localStorage.setItem(SETTINGS_KEY, JSON.stringify(s)); return true; } catch(e) { return false; }
  }

  function buildReportParts(t){
    const list = unreportedEntries(t);
    if (!list.length) return null;
    const label = t === 'envelope' ? '外装記録' : '開封記録';
    const subject = `郵便物 ${label} 報告 ${fmtDate(Date.now())}`;
    let body = '';
    list.forEach((e, i) => {
      body += `${i+1}. ${fmtDate(e.createdAt)}\n`;
      if (t === 'envelope') {
        body += `   差出人: ${e.sender}\n`;
        if (e.openRequested) body += `   → 開封依頼あり\n`;
      } else {
        const rel = data.envelope.find(x => x.id === e.relatedId);
        body += `   対応: ${rel ? rel.sender : '(不明)'}\n`;
      }
      if (e.memo) body += `   メモ: ${e.memo}\n`;
      body += '\n';
    });
    return { subject, body: body.trim() };
  }

  // 【件名】を本文の先頭に実テキストとして必ず含める（自動件名が反映されない場合の手動コピペ用）
  function buildReportText(t){
    const parts = buildReportParts(t);
    if (!parts) return '';
    return `【${parts.subject}】\n\n${parts.body}`;
  }

  function loadImageEl(src){
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => resolve(img);
      img.onerror = reject;
      img.src = src;
    });
  }

  function wrapLine(ctx, text, maxWidth){
    const lines = [];
    let cur = '';
    for (const ch of text) {
      const test = cur + ch;
      if (ctx.measureText(test).width > maxWidth && cur) { lines.push(cur); cur = ch; }
      else { cur = test; }
    }
    if (cur) lines.push(cur);
    return lines.length ? lines : [''];
  }

  // アイテム情報→写真→アイテム情報→写真…の順で1枚の画像に合成する。
  // メールの仕組み上「本文の途中に画像を割り込ませる」ことはできないため、
  // この並び順を保証する唯一の方法として、1枚の画像内にレイアウトする。
  async function composeReportImage(t){
    const list = unreportedEntries(t);
    if (!list.length) return null;
    const W = 720, pad = 24, indent = 14, lineH = 25, gapAfterEntry = 26;
    const maxTextW = W - pad - indent;
    const measure = document.createElement('canvas').getContext('2d');

    const blocks = [];
    for (const e of list) {
      let imgEl = null, imgW = 0, imgH = 0;
      if (e.photo) {
        try {
          imgEl = await loadImageEl(e.photo);
          const scale = Math.min(1, (W - pad * 2) / imgEl.width);
          imgW = Math.round(imgEl.width * scale);
          imgH = Math.round(imgEl.height * scale);
        } catch(err) { imgEl = null; }
      }
      const headerLine = fmtDate(e.createdAt);
      const subLines = [];
      if (t === 'envelope') {
        subLines.push(`差出人: ${e.sender}`);
        if (e.openRequested) subLines.push('→ 開封依頼あり');
      } else {
        const rel = data.envelope.find(x => x.id === e.relatedId);
        subLines.push(`対応: ${rel ? rel.sender : '(不明)'}`);
      }
      if (e.memo) subLines.push(`メモ: ${e.memo}`);

      measure.font = '15px sans-serif';
      const wrapped = [];
      subLines.forEach(l => wrapped.push(...wrapLine(measure, l, maxTextW)));

      blocks.push({ headerLine, wrapped, imgEl, imgW, imgH });
    }

    let totalH = pad;
    blocks.forEach(b => {
      totalH += lineH;
      totalH += b.wrapped.length * lineH;
      if (b.imgEl) totalH += b.imgH + 14;
      totalH += gapAfterEntry;
    });
    totalH += pad;

    const canvas = document.createElement('canvas');
    canvas.width = W; canvas.height = Math.round(totalH);
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#FFFFFF'; ctx.fillRect(0, 0, W, canvas.height);

    let y = pad;

    let idx = 1;
    for (const b of blocks) {
      ctx.font = 'bold 16px sans-serif';
      ctx.fillStyle = '#20242E';
      ctx.fillText(`${idx}. ${b.headerLine}`, pad, y + 16);
      y += lineH;
      ctx.font = '15px sans-serif';
      ctx.fillStyle = '#3A3F4C';
      b.wrapped.forEach(line => { ctx.fillText(line, pad + indent, y + 15); y += lineH; });
      if (b.imgEl) {
        ctx.drawImage(b.imgEl, pad, y, b.imgW, b.imgH);
        y += b.imgH + 14;
      }
      y += gapAfterEntry;
      ctx.strokeStyle = '#D6D0C0';
      ctx.beginPath(); ctx.moveTo(pad, y - gapAfterEntry / 2); ctx.lineTo(W - pad, y - gapAfterEntry / 2); ctx.stroke();
      idx++;
    }

    return new Promise(resolve => canvas.toBlob(b => resolve(b), 'image/jpeg', 0.85));
  }

  async function mailReport(t){
    const parts = buildReportParts(t);
    if (!parts) { toast('未報告の記録がありません'); return; }
    const s = loadSettings();
    const bodyWithSubject = `【${parts.subject}】\n\n${parts.body}`;
    toast('画像を準備しています…');
    try {
      const blob = await composeReportImage(t);
      if (blob && navigator.canShare) {
        const file = new File([blob], `postlog_${t}_${Date.now()}.jpg`, { type: 'image/jpeg' });
        if (navigator.canShare({ files: [file] })) {
          await navigator.share({ files: [file], title: parts.subject, text: bodyWithSubject });
          return;
        }
      }
    } catch(err) { /* fall through to mailto */ }
    // フォールバック：画像添付なしのmailto（宛先の@はエンコードしない）
    const bodyCRLF = bodyWithSubject.replace(/\n/g, '\r\n');
    const params = [`subject=${encodeURIComponent(parts.subject)}`, `body=${encodeURIComponent(bodyCRLF)}`];
    if (s.cc) params.push(`cc=${encodeURIComponent(s.cc)}`);
    const to = (s.to || '').trim();
    window.location.href = `mailto:${to}?${params.join('&')}`;
  }

  async function whatsappReport(t){
    const parts = buildReportParts(t);
    if (!parts) { toast('未報告の記録がありません'); return; }
    const s = loadSettings();
    const text = `【${parts.subject}】\n\n${parts.body}`;
    toast('画像を準備しています…');
    try {
      const blob = await composeReportImage(t);
      if (blob && navigator.canShare) {
        const file = new File([blob], `postlog_${t}_${Date.now()}.jpg`, { type: 'image/jpeg' });
        if (navigator.canShare({ files: [file] })) {
          await navigator.share({ files: [file], title: parts.subject, text });
          return;
        }
      }
    } catch(err) { /* fall through to wa.me */ }
    const num = (s.whatsapp || '').replace(/[^\d]/g, '');
    const url = num
      ? `https://wa.me/${num}?text=${encodeURIComponent(text)}`
      : `https://api.whatsapp.com/send?text=${encodeURIComponent(text)}`;
    window.open(url, '_blank');
  }

  async function copyReport(t){
    const text = buildReportText(t);
    if (!text) { toast('未報告の記録がありません'); return; }
    try { await navigator.clipboard.writeText(text); toast('コピーしました'); }
    catch(err) { toast('コピーに失敗しました'); }
  }

  async function markAllReported(t){
    const list = unreportedEntries(t);
    for (const e of list) { e.reported = true; e.reportDate = Date.now(); await saveEntry(t, e); }
    render();
    toast('報告済みにしました');
  }

  function entryCardHtml(t, e, opts){
    opts = opts || {};
    const readOnly = !!opts.readOnly;
    const envelopeSource = opts.envelopeSource || data.envelope;
    const thumb = e.photo
      ? `<img class="entry-thumb" src="${e.photo}" alt="">`
      : `<div class="entry-thumb placeholder">✉</div>`;
    const title = t === 'envelope' ? e.sender : (() => {
      const rel = envelopeSource.find(x => x.id === e.relatedId);
      return rel ? `開封: ${rel.sender}` : '開封記録';
    })();
    const tags = [];
    if (t === 'envelope' && e.openRequested) tags.push(`<span class="tag open-req">開封依頼</span>`);
    tags.push(e.reported ? `<span class="tag reported">報告済み</span>` : `<span class="tag pending">未報告</span>`);
    const stamp = e.reported
      ? `<div class="stamp">GEMELDET<br>${new Date(e.reportDate).toISOString().slice(0,10)}</div>`
      : '';
    return `
      <div class="entry-card">
        ${stamp}
        ${thumb}
        <div class="entry-body">
          <div class="entry-top">
            <div class="entry-sender">${title}</div>
            <div class="entry-date">${fmtDate(e.createdAt)}</div>
          </div>
          ${e.memo ? `<div class="entry-memo">${e.memo}</div>` : ''}
          <div class="entry-tags">${tags.join('')}</div>
          ${readOnly ? '' : `
          <div class="entry-actions">
            ${!e.reported
              ? `<button class="mini-btn" data-act="report" data-t="${t}" data-id="${e.id}">報告済みにする</button>`

            <button class="mini-btn danger" data-act="delete" data-t="${t}" data-id="${e.id}">削除</button>
          </div>`}
        </div>
      </div>`;
  }

    root.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => { tab = b.dataset.tab; render(); });

    if (addBtn) addBtn.onclick = () => openModal(tab === 'envelope' ? 'add-envelope' : 'add-opened');
    const reportBtn = root.querySelector('#report-btn');
    if (reportBtn) reportBtn.onclick = () => { reportModalOpen = true; render(); };

    root.querySelectorAll('[data-act="report"]').forEach(b => b.onclick = () => markReported(b.dataset.t, b.dataset.id));
    root.querySelectorAll('[data-act="unreport"]').forEach(b => b.onclick = () => markUnreported(b.dataset.t, b.dataset.id));
    root.querySelectorAll('[data-act="delete"]').forEach(b => b.onclick = () => { if (confirm('削除しますか？')) deleteEntry(b.dataset.t, b.dataset.id); });
    root.querySelectorAll('[data-act="edit"]').forEach(b => b.onclick = () => {
      const entry = data[b.dataset.t].find(e => e.id === b.dataset.id);
      if (entry) openModal(b.dataset.t === 'envelope' ? 'edit-envelope' : 'edit-opened', entry);
    });

    const reloadBtn = root.querySelector('#reload-btn');
    if (reloadBtn) reloadBtn.onclick = () => {
      const url = window.location.pathname + '?v=' + Date.now();
      window.location.href = url;
    };
    const dataBtn = root.querySelector('#data-btn');
    if (dataBtn) dataBtn.onclick = () => { dataModalOpen = true; render(); };
    const exportBtn = root.querySelector('#export-btn');
    if (exportBtn) exportBtn.onclick = exportAll;
    const clearExportedBtn = root.querySelector('#clear-exported-btn');
    if (clearExportedBtn) clearExportedBtn.onclick = () => { if (confirm('書き出し済みの記録を削除します。よろしいですか？')) clearExported(); };
    const dataCloseBtn = root.querySelector('#data-close');
    if (dataCloseBtn) dataCloseBtn.onclick = () => { dataModalOpen = false; render(); };

    const importBtn = root.querySelector('#import-btn');
    const importFileInput = root.querySelector('#import-file');
    if (importBtn && importFileInput) {
      importBtn.onclick = () => importFileInput.click();
      importFileInput.onchange = () => {
        const file = importFileInput.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          try {
            const parsed = JSON.parse(reader.result);
            importPreviewData = { envelope: parsed.envelope || [], opened: parsed.opened || [] };
            importPreviewOpen = true;
            dataModalOpen = false;
            render();
          } catch(e) {
            toast('JSONの読み込みに失敗しました');
          }
        };
        reader.readAsText(file);
      };
    }
    const importCloseBtn = root.querySelector('#import-close');
    if (importCloseBtn) importCloseBtn.onclick = () => { importPreviewOpen = false; render(); };
    const importRestoreBtn = root.querySelector('#import-restore');
    if (importRestoreBtn) importRestoreBtn.onclick = () => {
      if (!confirm('読み込んだ記録を今のリストに追加します。よろしいですか？')) return;
      let addedCount = 0, failedCount = 0;
      for (const t of ['envelope', 'opened']) {
        for (const e of (importPreviewData[t] || [])) {
          const exists = data[t].some(x => x.id === e.id);
          if (exists) continue;
          const ok = saveEntry(t, e);
          if (ok) { data[t].unshift(e); addedCount++; } else { failedCount++; }
        }
      }
      importPreviewOpen = false;
      render();
      toast(failedCount ? `${addedCount}件復元（${failedCount}件は容量不足で失敗）` : `${addedCount}件復元しました`);
    };

    root.querySelectorAll('[data-close]').forEach(v => v.onclick = (ev) => {
      if (ev.target !== v) return;
      if (v.dataset.close === 'veil') closeModal();
      if (v.dataset.close === 'report-veil') { reportModalOpen = false; render(); }
      if (v.dataset.close === 'data-veil') { dataModalOpen = false; render(); }
      if (v.dataset.close === 'import-veil') { importPreviewOpen = false; render(); }
    });

    const captureBtn = root.querySelector('#f-capture-btn');
    const fileInput = root.querySelector('#f-photo');
    if (captureBtn && fileInput) {
      captureBtn.onclick = () => fileInput.click();
      fileInput.onchange = async () => {
        const file = fileInput.files[0];
        if (!file) return;
        const dataUrl = await compressImage(file);
        draft.photo = dataUrl;
        const preview = root.querySelector('#f-preview');
        preview.src = dataUrl; preview.style.display = 'block';
        const statusEl = root.querySelector('#f-ocr-status');
        const text = await runOcr(dataUrl, statusEl);
        draft.ocrText = text;
        if (modalMode === 'add-envelope') {
          const guess = text.split('\n').map(s => s.trim()).filter(Boolean)[0] || '';
          draft.sender = guess;
          const senderInput = root.querySelector('#f-sender');
          if (senderInput) senderInput.value = guess;
          const ocrTextArea = root.querySelector('#f-ocrtext');
          if (ocrTextArea) ocrTextArea.value = text;
        }
      };
    }

    const pasteBtn = root.querySelector('#f-paste-btn');
    if (pasteBtn) pasteBtn.onclick = async () => {
      const statusEl = root.querySelector('#f-ocr-status');
      let text = '';
      let imageBlob = null;

      // まず navigator.clipboard.read() で画像＋テキストの両方を試みる
      try {
        if (navigator.clipboard.read) {
          const items = await navigator.clipboard.read();
          for (const item of items) {
            for (const type of item.types) {
              if (type.startsWith('image/') && !imageBlob) {
                imageBlob = await item.getType(type);
              }
              if (type === 'text/plain' && !text) {
                const blob = await item.getType(type);
                text = await blob.text();
              }
            }
          }
        }
      } catch(err) { /* read()が使えない/権限がない場合は下のreadTextにフォールバック */ }

      if (!text) {
        try { text = await navigator.clipboard.readText(); } catch(err) { /* ignore */ }
      }

      if (!text && !imageBlob) { toast('クリップボードに貼り付けできる内容がありません'); return; }

      if (imageBlob) {
        try {
          const file = new File([imageBlob], 'clipboard.jpg', { type: imageBlob.type || 'image/jpeg' });
          const dataUrl = await compressImage(file);
          draft.photo = dataUrl;
          const preview = root.querySelector('#f-preview');
          if (preview) { preview.src = dataUrl; preview.style.display = 'block'; }
        } catch(err) { /* 画像変換に失敗した場合はテキストだけ反映 */ }
      }

      if (text && text.trim()) {
        draft.ocrText = text;
        if (modalMode === 'add-envelope' || modalMode === 'edit-envelope') {
          const guess = text.split('\n').map(s => s.trim()).filter(Boolean)[0] || '';
          draft.sender = guess;
          const senderInput = root.querySelector('#f-sender');
          if (senderInput) senderInput.value = guess;
          const ocrTextArea = root.querySelector('#f-ocrtext');
          if (ocrTextArea) ocrTextArea.value = text;
        } else {
          const ocrTextArea = root.querySelector('#f-ocrtext-o');
          if (ocrTextArea) ocrTextArea.value = text;
        }
      }

      if (statusEl) statusEl.textContent = imageBlob ? '写真とテキストを貼り付けました。' : 'テキストを貼り付けました。';
      toast(imageBlob ? '写真とテキストを貼り付けました' : 'テキストを貼り付けました');

      // 画像だけ後から反映した場合、プレビュー以外の見た目も更新する必要があるので再描画
      if (imageBlob) render();
    };

    root.querySelectorAll('[data-related]').forEach(o => o.onclick = () => {
      draft.relatedId = o.dataset.related;
      root.querySelectorAll('[data-related]').forEach(x => x.classList.remove('selected'));
      o.classList.add('selected');
    });

    const cancelBtn = root.querySelector('#f-cancel');
    if (cancelBtn) cancelBtn.onclick = closeModal;
    const saveBtn = root.querySelector('#f-save');
    if (saveBtn) saveBtn.onclick = () => {
      if (modalMode === 'add-envelope') handleSaveEnvelope();
      else handleSaveOpened();
    };

    const copyBtn = root.querySelector('#report-copy');
    if (copyBtn) copyBtn.onclick = () => copyReport(tab);
    const mailBtn = root.querySelector('#report-mail');
    if (mailBtn) mailBtn.onclick = () => mailReport(tab);
    const waBtn = root.querySelector('#report-whatsapp');
    if (waBtn) waBtn.onclick = () => whatsappReport(tab);
    const markAllBtn = root.querySelector('#report-markall');
    if (markAllBtn) markAllBtn.onclick = () => { markAllReported(tab); reportModalOpen = false; render(); };
    const reportCloseBtn = root.querySelector('#report-close');
    if (reportCloseBtn) reportCloseBtn.onclick = () => { reportModalOpen = false; render(); };

    const settingsSaveBtn = root.querySelector('#settings-save-btn');
    if (settingsSaveBtn) settingsSaveBtn.onclick = () => {
      const to = root.querySelector('#s-to').value.trim();
      const cc = root.querySelector('#s-cc').value.trim();
      const whatsapp = root.querySelector('#s-whatsapp').value.trim();
      const ok = saveSettings({ to, cc, whatsapp });
      toast(ok ? '設定を保存しました' : '保存に失敗しました');
    };
  }

  // Fonts
  const link = document.createElement('link');
  link.rel = 'stylesheet';
  link.href = 'https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;600;700&display=swap';
  document.head.appendChild(link);

  loadAll().then(() => { handleIncomingParams(); }); // handleIncomingParams は async なので内部でawait処理される
})();
</script>
</body>
</html>
